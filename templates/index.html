<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Weight Prediction Form</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="form-container">
    <h1>Birth Weight Prediction</h1>
    <form>
      <label>Gestation</label>
      <input name="gestation" type="number">

      <label>Parity</label>
      <input name="parity" type="number">

      <label>Age</label>
      <input name="age" type="number">

      <label>Height</label>
      <input name="height" type="number">

      <label>Weight</label>
      <input name="weight" type="number">

      <label>Smoker</label>
      <input name="smoke" type="number">

      <button type="submit">Predict Birth Weight</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
